<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font environment of the visual reference gate. The writer copies this file
  into its run directory and sets FONTCONFIG_FILE to the copy before observing
  the environment, so fc-match and every browser read the observed bytes. It
  prefers Liberation Sans for sans-serif and system-ui, Liberation Serif for
  serif and Liberation Mono for monospace and ui-monospace, which have real
  bold faces. The system configuration appends sans-serif to every pattern
  that names no generic family, so the strong sans-serif preference makes each
  family that fontconfig does not know a strong alias of Liberation Sans, and
  WebKit accepts that alias for the first family that it looks up in
  fontconfig. ui-monospace, the first family of the product's monospace
  stacks, is therefore mapped to Liberation Mono explicitly. Its SHA-256 is a
  compared field of tests/visual/environment.json.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit></match>
</fontconfig>

name: scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard / repository hygiene
    if: ${{ github.event.repository.private == false || vars.ENABLE_SCORECARD == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          publish_results: false
          results_file: scorecard-results.sarif
          results_format: sarif

      - name: Upload Scorecard SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.sha }}
          path: scorecard-results.sarif
          if-no-files-found: warn
          retention-days: 14

  upload-sarif:
    name: scorecard / provider upload
    if: ${{ github.event.repository.private == false || vars.ENABLE_SCORECARD_PUBLISH == 'true' }}
    needs: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download Scorecard SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-sarif-${{ github.sha }}
          path: artifacts/scorecard

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: artifacts/scorecard/scorecard-results.sarif
          category: scorecard-repository-hygiene

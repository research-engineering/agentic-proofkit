name: scorecard-publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard / public publish
    if: ${{ github.event.repository.private == false || vars.ENABLE_SCORECARD_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish Scorecard results
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          publish_results: true
          results_file: scorecard-public-results.json
          results_format: json
